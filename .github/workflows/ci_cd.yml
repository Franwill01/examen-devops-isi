
name: Examen DevOps CI-CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/isi-devops-diti3
  IMAGE_TAG: latest
  DOCKER_REGISTRY: docker.io

jobs:

  build:
    name: Build et Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build
        run: |
          docker build -t "$DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG" .

      - name: Docker Push
        run: |
          docker push "$DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

  deploy:
    name: Deploy Windows
    needs: build
    runs-on: [self-hosted, windows, x64, runner-isi]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Docker Pull
        run: |
          $image = '{0}/{1}:{2}' -f $env:DOCKER_REGISTRY, $env:IMAGE_NAME, $env:IMAGE_TAG
          docker pull $image
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Stop Old Container
        run: |
          $running = docker ps -q --filter "name=^/isi-web$"
          if ($running) {
            docker stop isi-web
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Remove Old Container
        run: |
          $existing = docker ps -aq --filter "name=^/isi-web$"
          if ($existing) {
            docker rm isi-web
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Run New Container
        run: |
          $image = '{0}/{1}:{2}' -f $env:DOCKER_REGISTRY, $env:IMAGE_NAME, $env:IMAGE_TAG
          docker run -d --name isi-web --restart unless-stopped -p 80:80 $image
          if ($LASTEXITCODE -ne 0) { exit 1 }
